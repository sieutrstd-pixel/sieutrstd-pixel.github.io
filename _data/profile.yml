short_bio_text_justify: false
short_bio: >-
  <p>
    I am a Master's student in Computer Science at the <strong>University of Arkansas</strong>, where I work as a
    Graduate Research Assistant in the <strong>AICV Lab</strong>. Before joining UARK, I graduated as
    <strong>valedictorian</strong> from Vietnam National University Ho Chi Minh City (VNU-HCMC), and spent a year
    building production AI systems as an AI Engineer at Day One Company.
  </p>
  <p>
    My research centers on <strong>object-centric representation learning</strong>: recovering, <strong>without
    supervision</strong>, the decomposition of a scene into entities that persist when they leave view, carry
    properties, and act on one another. I want to carry that decomposition into <strong>world models</strong> and
    <strong>robot learning</strong> — entity states rolled forward so an agent can weigh the consequences of an
    action before taking it, and dynamics composed from interactions rather than one opaque transition.
  </p>
  <p>
    <strong>
      I am always happy to talk about research or potential collaborations — feel free to reach out by
      <a href="mailto:stran5@uark.edu">email</a>.
    </strong>
  </p>

